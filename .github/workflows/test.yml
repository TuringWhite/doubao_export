name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试
        run: node test.js
      - name: 清单与引用校验
        run: python3 scripts/check-manifest.py
